# Copy to wallets.yaml and replace the sample values.
# These addresses are fake. Do not put a real transaction export in this repository.

own:
  - label: Ledger ETH
    chain: ethereum
    address: "0x1111111111111111111111111111111111111111"
  - label: Cold BTC
    chain: bitcoin
    address: "bc1qexampleexampleexampleexampleexampleexamp"
  - label: Coinbase
    account: Coinbase

# Sends to these stay disposals and are not paired with a deposit.
# A destination address is optional. Use description (a case-insensitive
# substring of the row description) or wallet plus asset when TxDest is blank.
payees:
  - label: Example processor
    chain: ethereum
    address: "0x2222222222222222222222222222222222222222"
  - label: Card spend
    description: "card purchase"
  - label: Exchange BTC cash-out
    wallet: Example Exchange
    asset: BTC
  - label: One withdrawal
    tx_hash: "0xexamplehash"
  - label: One dated withdrawal
    date: "2024-06-01"
    asset: ETH
    amount: "1.5"

match:
  # Koinly's default window is about 24 hours.
  window_hours: 24
  # 0.02 means the amounts may differ by 2% of the larger amount.
  amount_tolerance: "0.02"
  # Extra absolute allowance, in units of the asset. "0" disables it.
  amount_tolerance_abs: "0"
  # Opt in only after an accountant agrees. When true, the first symbol in each
  # token group is the shared Section 104 pool, and a trade of about 1:1 inside
  # the group (a wrap or unwrap) becomes a transfer rather than a disposal.
  # HMRC has not said that wrapping is not a disposal.
  share_pools: false
  # Off by default. When true, two legs on the same wallet that share a tx hash,
  # name different assets, and have a blank destination become one trade.
  # An LP or receipt token stays on the review queue.
  same_wallet_swaps: false

# Symbols that may be two sides of one internal move. The first symbol is the
# shared pool name when match.share_pools is true. Otherwise symbols are not rewritten.
token_groups:
  # WETH is one-to-one with ETH. stETH shares the pool but is not one-to-one.
  # An accountant must confirm the liquid member is not a disposal.
  - members: [ETH, WETH]
    liquid_members: [stETH]
  - [BTC, cbBTC]

# Lookalike and spam tickers. They are listed in possible-spam, not needs-review.
spam:
  symbols:
    - USDT.e
    - USDC.e
  patterns:
    - claim
    - "visit"
    - "airdrop claim"

# Official token contracts. A row that uses the asset or one of its names, and
# carries a different contract, is address-poisoning spam. The name is not merged
# into the official pool. These addresses are fake.
official_contracts:
  - asset: USDT
    chain: ethereum
    address: "0x0000000000000000000000000000000000000a11"
    names:
      - Tether USD

# Lookalike addresses used by address-poisoning. A source or destination match
# is spam even when the ticker is an official asset.
poison_addresses:
  - label: Example lookalike
    chain: ethereum
    address: "0x0000000000000000000000000000000000000b0b"

# Fake CEX deposit addresses. A send here is a transfer to the venue.
venues:
  - label: Example CEX deposit
    chain: ethereum
    address: "0x00000000000000000000000000000000000000c1"

# Fake routers, LP tokens and lending contracts.
# tax_treatment below is not a confirmed rule. Leave it as review until an accountant agrees.
contracts:
  - label: Example router
    chain: ethereum
    category: swap
    address: "0x00000000000000000000000000000000000000d1"
  - label: Example LP
    chain: ethereum
    category: lp
    address: "0x00000000000000000000000000000000000000d2"
  - label: Example lending
    chain: ethereum
    category: collateral
    address: "0x00000000000000000000000000000000000000d3"
  - label: Example stake
    chain: ethereum
    category: stake
    address: "0x00000000000000000000000000000000000000d4"

bridges:
  patterns:
    - bridge
  contracts:
    - label: Example bridge
      chain: ethereum
      category: bridge
      address: "0x00000000000000000000000000000000000000b1"

# Longer patterns win. income, dust and ignore are the only treatments.
utilities:
  - match: launchpool
    treatment: income
  - match: dust conversion
    treatment: dust
  - match: create-token-account
    treatment: ignore

margin:
  asset_suffixes:
    - USDTM
    - PERP
  patterns:
    - realized gain
    - daily total
    - bot daily

# LP, collateral and stake are deliberately not hard-coded. review | transfer | disposal.
tax_treatment:
  lp: review
  collateral: review
  stake: review

# Extra LP and receipt symbols. Built-in patterns already catch CAKE-LP, SLP,
# BPT and UNI-V2. These add to that list; they do not replace it.
lp_tokens:
  symbols:
    - UNI-V2
  patterns:
    - "-LP"

official_assets:
  - USDT
  - BTC
  - ETH

# Koinly prints "BTC (Bitcoin)". That label matches BTC. A different name in the
# brackets, such as "BTC (Bear Trump Coin)", stays a separate asset.
# Omit this block to use the same built-in names.
asset_names:
  BTC:
    - Bitcoin
    - BTC (Bitcoin)
  ETH:
    - Ethereum
    - ETH (Ethereum)
  USDT:
    - Tether
    - USDT (Tether)
# "Tether USD" is not a built-in name. Add it under USDT only when that exact
# label is official USDT. A lookalike such as "USDT (Tether USD)" stays separate
# until this list names it.

reconcile:
  quantity_epsilon: "0.00000001"
  cost_band_ratio: "0.005"
  cost_band_abs: "1"
  gains_band_ratio: "0.01"
  income_abs: "0.01"

# Rows excluded from the T1 wallet-count comparison. Reason is required.
count_exceptions:
  - reason: sample bot wallet excluded from the count
    wallet: Example Bot

# Leftovers the integrity check may ignore. Reason is required.
# A tx_hash, or a date plus asset plus amount, is required.
review_exceptions:
  - reason: sample leftover already checked by hand
    tx_hash: "0x0000000000000000000000000000000000000001"
