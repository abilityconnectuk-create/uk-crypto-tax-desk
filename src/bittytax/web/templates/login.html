{% extends "base.html" %}
{% block body %}
    <h1>Sign in</h1>
    <p class="lede">This sign-in is for a browser on your tailnet. Opening 127.0.0.1 on this computer does not ask for a password.</p>
    {% if error %}
        <p class="warn">{{ error }}</p>
    {% endif %}
    <form class="stack" method="post" action="/login">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="password">Password</label>
        <input id="password"
               name="password"
               type="password"
               required
               autocomplete="current-password">
        <button type="submit">Sign in</button>
    </form>
{% endblock %}
