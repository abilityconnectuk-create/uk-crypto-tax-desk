{% extends "base.html" %}
{% block body %}
    <h1>Delete {{ wallet.name }}</h1>
    <p class="lede">
        This hides the wallet. Rows you have already accepted stay in the ledger.
        The stored key is removed from this computer. This cannot be undone from the list.
    </p>
    <form method="post" action="/wallets/delete">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="wallet_id" value="{{ wallet.id }}">
        <input type="hidden" name="confirm" value="yes">
        <button type="submit">Delete wallet</button>
    </form>
    <p>
        <a href="/wallets">Keep this wallet</a>
    </p>
{% endblock %}
